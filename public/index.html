        <div data-template-id="chat-welcome" class="canva-banner rounded-xl p-3 text-sm"></div>
       </div>
       <form id="chat-form" class="p-4 border-t border-slate-200 flex gap-2">
        <label class="sr-only" for="chat-input">Message</label><input id="chat-input" data-template-id="chat-input" class="canva-input min-w-0 grow rounded-xl border border-slate-300 px-3 py-2" type="text" maxlength="250"><button data-template-id="send-button" class="canva-button rounded-xl px-3" type="submit" aria-label="Send message"><i data-lucide="send" width="17" height="17"></i></button>
       </form>
      </div>
     </aside>
    </div>
    <footer class="px-4 py-4 flex justify-center border-t border-white/10">
     <div class="flex flex-wrap justify-center gap-2"><button id="mic-toggle" data-template-id="mic-toggle" class="canva-button toolbar-button" type="button" aria-label="Toggle microphone"><i data-lucide="mic" width="20" height="20"></i></button> <button id="camera-toggle" data-template-id="camera-toggle" class="canva-button toolbar-button" type="button" aria-label="Toggle camera"><i data-lucide="video" width="20" height="20"></i></button> <button id="reaction-toggle" data-template-id="reaction-toggle" class="canva-button toolbar-button" type="button" aria-label="Send reaction"><i data-lucide="smile-plus" width="20" height="20"></i></button> <button id="layout-toggle" data-template-id="layout-toggle" class="canva-button toolbar-button" type="button" aria-label="Toggle layout"><i data-lucide="layout-grid" width="20" height="20"></i></button> <button id="participants-toggle" data-template-id="participants-toggle" class="canva-button toolbar-button" type="button" aria-label="Show participants"><i data-lucide="users" width="20" height="20"></i></button> <button id="chat-toggle" data-template-id="chat-toggle" class="canva-button toolbar-button" type="button" aria-label="Show chat"><i data-lucide="message-circle" width="20" height="20"></i></button>
     </div>
    </footer>
   </section>
  </div>
  <script>
    let meetings=[], activeRole="admin", mediaStream=null, activePanel="";
    const list=document.getElementById("meeting-list");
    const setMessage=(el,text,bad)=>{el.textContent=text;el.className="text-sm min-h-5 "+(bad?"text-red-600":"text-emerald-700")};
    const readableDate=v=>v?new Date(v+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"Date to be confirmed";
    const participantText=raw=>{const n=(raw||"").split(",").filter(v=>v.trim()).length;return n?n+(n===1?" participant":" participants"):"Open attendance"};
    const statusStyle=s=>s==="Live"?"background:#dcfce7;color:#157347":s==="Completed"?"background:#eef2f7;color:#52647d":"background:#e8f2ff;color:#075bcb";

    function openRole(role){activeRole=role;document.getElementById("access-view").classList.add("hidden");document.getElementById("portal-view").classList.remove("hidden");document.getElementById("admin-panel").classList.toggle("hidden",role!=="admin");document.getElementById("role-badge").textContent=role==="admin"?"Administrator workspace":"Participant workspace";document.getElementById("admin-profile-avatar").classList.toggle("hidden",role!=="admin");document.getElementById("user-profile-avatar").classList.toggle("hidden",role==="admin");renderMeetings(meetings)}
    function createCard(m){
      const fragment=document.getElementById("meeting-card-template").content.cloneNode(true),card=fragment.querySelector("[data-template-id='meeting-card']");
      card.dataset.status=m.meeting_status||"Scheduled";card.querySelector("[data-role='title']").textContent=m.meeting_title;card.querySelector("[data-role='details']").textContent=readableDate(m.meeting_date)+" · "+m.meeting_time+" · "+m.meeting_host;card.querySelector("[data-role='description']").textContent=m.meeting_description||"No agenda has been added yet.";card.querySelector("[data-role='participant-count']").textContent=participantText(m.meeting_participants);
      const badge=card.querySelector("[data-template-id='meeting-status']");badge.textContent=m.meeting_status||"Scheduled";badge.style.cssText=statusStyle(m.meeting_status||"Scheduled");
      card.querySelector("[data-role='admin-actions']").classList.toggle("hidden",activeRole!=="admin");
      card.querySelector("[data-action='join']").onclick=()=>openMeeting(m);card.querySelector("[data-action='status']").onclick=()=>cycleStatus(m,card);
      card.querySelector("[data-action='remove']").onclick=()=>{card.querySelector("[data-action='remove']").classList.add("hidden");const c=card.querySelector("[data-role='delete-confirm']");c.classList.remove("hidden");c.classList.add("flex")};
      card.querySelector("[data-action='cancel-delete']").onclick=()=>{card.querySelector("[data-action='remove']").classList.remove("hidden");card.querySelector("[data-role='delete-confirm']").classList.add("hidden")};
      card.querySelector("[data-action='confirm-delete']").onclick=()=>deleteMeeting(m,card);return card;
    }
    function renderMeetings(data){meetings=data.slice().sort((a,b)=>(a.meeting_date+a.meeting_time).localeCompare(b.meeting_date+b.meeting_time));list.querySelectorAll("[data-template-id='meeting-card']").forEach(n=>n.remove());meetings.forEach(m=>list.appendChild(createCard(m)));document.getElementById("empty-state").classList.toggle("hidden",meetings.length>0);document.getElementById("meeting-count").textContent=meetings.length+(meetings.length===1?" meeting":" meetings");lucide.createIcons()}
    const handler={onDataChanged(data){renderMeetings(data)}};

    document.getElementById("meeting-form").addEventListener("submit",async e=>{e.preventDefault();const message=document.getElementById("form-message"),button=document.getElementById("create-button");if(meetings.length>=999)return setMessage(message,"The 999 meeting limit has been reached.",true);button.disabled=true;setMessage(message,"Saving meeting…",false);const r=await window.dataSdk.create({meeting_title:document.getElementById("meeting-title").value.trim(),meeting_date:document.getElementById("meeting-date").value,meeting_time:document.getElementById("meeting-time").value,meeting_host:document.getElementById("meeting-host").value.trim(),meeting_status:"Scheduled",meeting_description:document.getElementById("meeting-description").value.trim(),meeting_participants:document.getElementById("meeting-participants").value.trim()});button.disabled=false;if(r.isOk){e.target.reset();setMessage(message,"Meeting saved to your Canva Sheet.",false)}else setMessage(message,"Unable to save this meeting.",true)});
    async function cycleStatus(m,card){const states=["Scheduled","Live","Completed"],next=states[(states.indexOf(m.meeting_status||"Scheduled")+1)%3],r=await window.dataSdk.update({...m,meeting_status:next});if(!r.isOk){const x=card.querySelector("[data-role='card-message']");x.textContent="Could not update meeting status.";x.classList.remove("hidden")}}
    async function deleteMeeting(m,card){const r=await window.dataSdk.delete(m);if(!r.isOk){const x=card.querySelector("[data-role='card-message']");x.textContent="Could not remove this meeting.";x.classList.remove("hidden")}}

    async function openMeeting(m){document.querySelector("[data-role='room-title']").textContent=m.meeting_title;document.getElementById("meeting-modal").classList.remove("hidden");document.getElementById("media-message").textContent="Requesting your local camera and microphone…";try{mediaStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById("local-video").srcObject=mediaStream;document.getElementById("local-video").classList.remove("hidden");document.getElementById("camera-off-state").classList.add("hidden");document.getElementById("media-message").textContent="Your local preview is ready. Attendee tiles are a meeting-room preview."}catch{document.getElementById("media-message").textContent="Camera or microphone access is unavailable. You can still explore this local meeting preview."}}
    function stopMedia(){if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;document.getElementById("local-video").srcObject=null;document.getElementById("local-video").classList.add("hidden");document.getElementById("camera-off-state").classList.remove("hidden")}
    function showPanel(type){activePanel=type;const panel=document.getElementById("side-panel");panel.classList.remove("hidden");document.getElementById("participants-content").classList.toggle("hidden",type!=="participants");document.getElementById("chat-content").classList.toggle("hidden",type!=="chat");document.getElementById("side-title").textContent=type==="chat"?"Local chat":"Participants";lucide.createIcons()}
    function closePanel(){activePanel="";document.getElementById("side-panel").classList.add("hidden")}
    function react(){const el=document.getElementById("reaction-display");el.textContent="👏";el.classList.remove("hidden","reaction-pop");void el.offsetWidth;el.classList.add("reaction-pop");setTimeout(()=>el.classList.add("hidden"),800)}

    document.getElementById("admin-access").onclick=()=>openRole("admin");document.getElementById("practice-access").onclick=()=>openRole("practice");
    document.getElementById("switch-role").onclick=()=>{stopMedia();document.getElementById("portal-view").classList.add("hidden");document.getElementById("access-view").classList.remove("hidden")};
    document.getElementById("leave-button").onclick=()=>{stopMedia();closePanel();document.getElementById("meeting-modal").classList.add("hidden")};
    document.getElementById("camera-toggle").onclick=()=>{const t=mediaStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById("local-video").classList.toggle("hidden",!t.enabled);document.getElementById("camera-off-state").classList.toggle("hidden",t.enabled)}};
    document.getElementById("mic-toggle").onclick=()=>{const t=mediaStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById("media-message").textContent=t.enabled?"Microphone is on.":"Microphone is muted."}};
    document.getElementById("layout-toggle").onclick=()=>document.getElementById("video-grid").classList.toggle("speaker-layout");
    document.getElementById("participants-toggle").onclick=()=>showPanel("participants");document.getElementById("chat-toggle").onclick=()=>showPanel("chat");document.getElementById("close-panel").onclick=closePanel;document.getElementById("reaction-toggle").onclick=react;
    document.getElementById("chat-form").addEventListener("submit",e=>{e.preventDefault();const input=document.getElementById("chat-input"),text=input.value.trim();if(!text)return;const bubble=document.createElement("div");bubble.className="ml-auto max-w-[85%] rounded-2xl rounded-br-sm bg-blue-700 text-white px-3 py-2 text-sm";bubble.textContent=text;document.getElementById("chat-list").appendChild(bubble);input.value="";document.getElementById("chat-list").scrollTop=document.getElementById("chat-list").scrollHeight});
    document.addEventListener("DOMContentLoaded",async()=>{lucide.createIcons();const r=await window.dataSdk.init(handler);if(!r.isOk)setMessage(document.getElementById("form-message"),"Meeting records could not be loaded.",true)});
  </script>
 </body>
</html>
