<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICTE SecureMeet</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font-weight:700}
input{width:100%;padding:12px;border:1px solid #334155;border-radius:9px;background:#0b1728;color:#fff}
.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0b2a55,#020617)}
.card{width:min(440px,100%);background:#0d1929;border:1px solid #26384f;border-radius:18px;padding:26px;box-shadow:0 20px 60px #0008}
.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;background:#1e293b;color:#fff}.tabs .on{background:#2563eb}
label{display:block;margin:14px 0;font-size:14px}label input{margin-top:6px}
.primary{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#334155;color:#fff}.full{width:100%}
.top{height:62px;background:#020617;border-bottom:1px solid #243247;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.main{max-width:1150px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:15px}.panel{background:#fff;color:#0f172a;border-radius:15px;padding:18px}
.row{display:flex;gap:8px}.row input{flex:1}.meeting{margin-top:10px;padding:12px;border:1px solid #d5deea;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.live{color:#15803d;font-weight:bold;font-size:12px}
.room{height:100vh;height:100dvh;display:flex;flex-direction:column;background:#020617}.roomtop{padding:9px 13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #243247;gap:8px}
.roommain{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}.videos{overflow:auto;padding:9px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;align-content:start}
.tile{position:relative;min-height:180px;background:#111827;border:1px solid #263449;border-radius:12px;overflow:hidden;aspect-ratio:16/10}.tile video{width:100%;height:100%;object-fit:cover;background:#111827}
.name{position:absolute;left:8px;bottom:8px;background:#000b;padding:5px 8px;border-radius:6px;font-size:12px}.state{position:absolute;right:8px;top:8px;background:#000b;padding:5px 7px;border-radius:6px;font-size:11px}
.chat{display:flex;flex-direction:column;min-height:0;background:#0b1422;border-left:1px solid #243247}.chat h3{padding:12px;margin:0;border-bottom:1px solid #243247}.msgs{flex:1;overflow:auto;padding:10px}.msg{background:#172235;padding:8px;border-radius:8px;margin-bottom:7px}.msg b{font-size:12px;color:#60a5fa}.msg div{font-size:13px;margin-top:3px;word-break:break-word}
.chatform{display:flex;gap:6px;padding:8px}.chatform input{min-width:0}.controls{height:76px;display:flex;justify-content:center;align-items:center;gap:9px;border-top:1px solid #243247}.ctrl{width:48px;height:48px;border-radius:50%;padding:0;background:#334155;color:#fff;font-size:18px}.ctrl.off{background:#dc2626}.mobilechat{display:none}
.status{font-size:12px;color:#94a3b8;margin-top:8px;min-height:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.roommain{grid-template-columns:1fr}.chat{display:none}.chat.open{display:flex;position:fixed;z-index:10;top:62px;right:0;bottom:76px;width:min(350px,92vw);box-shadow:-20px 0 40px #0008}.mobilechat{display:inline-block}.videos{grid-template-columns:repeat(2,minmax(0,1fr));padding:6px;gap:6px}.tile{min-height:125px}.row{flex-direction:column}}
@media(max-width:430px){.videos{grid-template-columns:1fr}.tile{min-height:190px}}
</style>
</head>
<body>

<section id="auth" class="auth">
<div class="card">
<h1>🛡️ AICTE SecureMeet</h1>
<p style="color:#9fb0c5">Secure real-time meeting demo</p>
<div class="tabs">
<button id="adminTab" class="on">Admin</button>
<button id="participantTab">Participant</button>
</div>

<div id="adminForm">
<label>Name<input id="adminName" value="AICTE Administrator"></label>
<label>Email<input id="adminEmail" type="email" value="admin@aicte-securemeet.demo"></label>
<label>Password<input id="adminPassword" type="password" value="DemoPass123!"></label>
<button id="adminLogin" class="primary full">Login as Admin</button>
</div>

<div id="participantForm" class="hidden">
<label>Name<input id="participantName" placeholder="Your name"></label>
<label>Email<input id="participantEmail" type="email" placeholder="your@email.com"></label>
<button id="participantLogin" class="primary full">Continue as Participant</button>
</div>
</div>
</section>

<section id="dashboard" class="hidden">
<header class="top">
<b>🛡️ AICTE SecureMeet</b>
<span><span id="who"></span> <button id="logout" class="gray">Logout</button></span>
</header>
<main class="main">
<h2 id="welcome"></h2>
<div class="grid">
<section class="panel">
<h3>🎥 Meetings</h3>
<div id="createBox">
<div class="row">
<input id="meetingTitle" value="AICTE Secure Meeting">
<button id="createMeeting" class="primary">Start Meeting</button>
</div>
</div>
<h4>Join by Meeting ID</h4>
<div class="row">
<input id="meetingIdInput" placeholder="Meeting ID">
<button id="joinMeeting" class="green">Join</button>
</div>
<div id="meetingList"></div>
<div id="dashStatus" class="status"></div>
</section>
<section class="panel">
<h3>🔐 Security</h3>
<p>WebRTC camera/microphone.</p>
<p>Live Socket.IO signaling and chat.</p>
<p>Demo application — do not use real confidential data.</p>
</section>
</div>
</main>
</section>

<section id="room" class="room hidden">
<header class="roomtop">
<div>
<b id="roomTitle">AICTE SecureMeet</b>
<small id="roomId" style="display:block;color:#94a3b8"></small>
</div>
<div>
<button id="copyLink" class="gray">🔗 Copy</button>
<button id="mobileChat" class="gray mobilechat">💬</button>
<button id="endMeeting" class="red hidden">End</button>
<button id="leaveMeeting" class="red">Leave</button>
</div>
</header>

<div class="roommain">
<div id="videos" class="videos"></div>
<aside id="chat" class="chat">
<h3>💬 Chat</h3>
<div id="messages" class="msgs"></div>
<form id="chatForm" class="chatform">
<input id="chatInput" maxlength="1000" placeholder="Message...">
<button class="primary">Send</button>
</form>
</aside>
</div>

<footer class="controls">
<button id="mic" class="ctrl">🎙️</button>
<button id="camera" class="ctrl">📷</button>
<button id="share" class="ctrl">🖥️</button>
</footer>
</section>

<script>
"use strict";

const socket = io({
  transports: ["websocket","polling"],
  reconnection: true,
  reconnectionAttempts: Infinity,
  timeout: 10000
});

let user = null;
let meeting = null;
let localStream = null;
let joining = false;

const peers = new Map();
const names = new Map();
const pendingIce = new Map();

const $ = id => document.getElementById(id);

const esc = s => String(s).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));

function show(id){
  ["auth","dashboard","room"].forEach(x => $(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
}

function setStatus(text){
  if($("dashStatus")) $("dashStatus").textContent = text || "";
}

socket.on("connect", () => {
  if(user && !meeting) refresh();
});

socket.on("connect_error", err => {
  console.error("Socket connection error:", err);
  setStatus("Server connection problem. Retrying…");
});

$("adminTab").onclick = () => {
  $("adminTab").classList.add("on");
  $("participantTab").classList.remove("on");
  $("adminForm").classList.remove("hidden");
  $("participantForm").classList.add("hidden");
};

$("participantTab").onclick = () => {
  $("participantTab").classList.add("on");
  $("adminTab").classList.remove("on");
  $("participantForm").classList.remove("hidden");
  $("adminForm").classList.add("hidden");
};

$("adminLogin").onclick = () => {
  const n = $("adminName").value.trim();
  const e = $("adminEmail").value.trim();
  const p = $("adminPassword").value;
  if(!n || !e || !p) return alert("Fill all fields.");
  user = {name:n,email:e,role:"Admin"};
  dashboard();
};

$("participantLogin").onclick = () => {
  const n = $("participantName").value.trim();
  const e = $("participantEmail").value.trim();
  if(!n || !e) return alert("Enter name and email.");
  user = {name:n,email:e,role:"Participant"};
  dashboard();
};

function dashboard(){
  show("dashboard");
  $("welcome").textContent = "Welcome, " + user.name;
  $("who").textContent = user.role + " · " + user.email;
  $("createBox").classList.toggle("hidden", user.role !== "Admin");
  refresh();
}

function refresh(){
  if(!socket.connected){
    setStatus("Connecting to meeting server…");
    return;
  }
  socket.emit("list-meetings", list => {
    const meetings = Array.isArray(list) ? list : [];
    $("meetingList").innerHTML = meetings.length
      ? meetings.map(m => `
        <div class="meeting">
          <div>
            <span class="live">● LIVE</span><br>
            <b>${esc(m.id)}</b><br>
            <small>${esc(m.title || "Meeting")} · Host: ${esc(m.hostName || "Admin")} · ${m.participantCount || 0} connected</small>
          </div>
          <button class="green" onclick="joinRoom('${esc(m.id)}')">Join</button>
        </div>`).join("")
      : "<p>No live meetings.</p>";
    setStatus("");
  });
}

/*
 * IMPORTANT:
 * Admin creation does NOT call join-meeting again.
 * The server has already placed the admin in the new meeting.
 */
$("createMeeting").onclick = () => {
  if(!user || user.role !== "Admin") return;

  const title = $("meetingTitle").value.trim() || "AICTE Secure Meeting";
  setStatus("Creating meeting…");

  socket.emit("create-meeting", {
    name: user.name,
    title
  }, async r => {
    if(!r || !r.ok){
      setStatus("");
      return alert(r?.error || "Create meeting failed.");
    }

    meeting = {
      id: r.meetingId,
      title: r.title || title,
      hostSocket: r.hostSocket || socket.id,
      isHost: true
    };

    setStatus("");
    await enterRoom([]);
  });
};

$("joinMeeting").onclick = () => {
  const id = $("meetingIdInput").value.trim().toUpperCase();
  if(!id) return alert("Enter a Meeting ID.");
  joinRoom(id);
};

window.joinRoom = id => {
  if(joining) return;
  joining = true;
  setStatus("Joining meeting…");

  socket.emit("join-meeting", {
    meetingId: String(id).trim().toUpperCase(),
    name: user.name
  }, async r => {
    joining = false;

    if(!r || !r.ok){
      setStatus("");
      return alert(r?.error || "Meeting unavailable.");
    }

    meeting = {
      id: r.meetingId,
      title: r.title || "AICTE Secure Meeting",
      hostSocket: r.hostSocket,
      isHost: r.hostSocket === socket.id
    };

    (r.participants || []).forEach(p => {
      if(p.socketId !== socket.id) names.set(p.socketId, p.name);
    });

    setStatus("");
    await enterRoom(r.participants || []);
  });
};

async function enterRoom(participants){
  show("room");

  $("roomTitle").textContent = meeting.title;
  $("roomId").textContent = "Meeting ID: " + meeting.id;
  $("endMeeting").classList.toggle("hidden", !meeting.isHost);

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode:"user"},
      audio: {
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });
  }catch(e){
    console.error("getUserMedia:", e);
    alert("Camera/microphone permission is required. Allow it and rejoin.");
    cleanup(false);
    show("dashboard");
    refresh();
    return;
  }

  addVideo(socket.id, localStream, user.name, true);

  /*
   * Participant: connect to the host.
   * Host: connect to every participant already present.
   */
  if(meeting.isHost){
    for(const p of participants){
      if(p.socketId !== socket.id){
        names.set(p.socketId, p.name);
        await makePeer(p.socketId, true);
      }
    }
  }else if(meeting.hostSocket && meeting.hostSocket !== socket.id){
    await makePeer(meeting.hostSocket, true);
  }
}

async function makePeer(id, createOffer){
  if(!id || !localStream || id === socket.id) return null;

  if(peers.has(id)) return peers.get(id);

  const pc = new RTCPeerConnection({
    iceServers: [
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"},
      {urls:"stun:stun2.l.google.com:19302"}
    ]
  });

  peers.set(id, pc);
  pendingIce.set(id, []);

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.onicecandidate = event => {
    if(event.candidate){
      socket.emit("ice-candidate", {
        target:id,
        candidate:event.candidate
      });
    }
  };

  pc.ontrack = event => {
    const stream = event.streams && event.streams[0]
      ? event.streams[0]
      : null;

    if(stream){
      addVideo(id, stream, names.get(id) || "Participant", false);
    }
  };

  pc.onconnectionstatechange = () => {
    const state = pc.connectionState;
    console.log("Peer", id, state);

    if(state === "connected"){
      updateVideoState(id, "● LIVE");
    }

    if(["failed","closed"].includes(state)){
      removePeer(id);
    }
  };

  if(createOffer){
    try{
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("offer", {
        target:id,
        offer:pc.localDescription
      });
    }catch(e){
      console.error("Offer error:", e);
    }
  }

  return pc;
}

socket.on("offer", async d => {
  if(!meeting || !localStream || !d?.sender || !d?.offer) return;

  try{
    const pc = await makePeer(d.sender, false);
    if(!pc) return;

    await pc.setRemoteDescription(d.offer);
    await flushIce(d.sender);

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    socket.emit("answer", {
      target:d.sender,
      answer:pc.localDescription
    });
  }catch(e){
    console.error("Offer handling error:", e);
  }
});

socket.on("answer", async d => {
  if(!d?.sender || !d?.answer) return;

  try{
    const pc = peers.get(d.sender);
    if(!pc) return;

    await pc.setRemoteDescription(d.answer);
    await flushIce(d.sender);
  }catch(e){
    console.error("Answer handling error:", e);
  }
});

socket.on("ice-candidate", async d => {
  if(!d?.sender || !d?.candidate) return;

  const pc = peers.get(d.sender);

  if(!pc){
    pendingIce.set(d.sender, pendingIce.get(d.sender) || []);
    pendingIce.get(d.sender).push(d.candidate);
    return;
  }

  if(pc.remoteDescription){
    try{
      await pc.addIceCandidate(d.candidate);
    }catch(e){
      console.warn("ICE candidate error:", e);
    }
  }else{
    pendingIce.get(d.sender).push(d.candidate);
  }
});

async function flushIce(id){
  const pc = peers.get(id);
  if(!pc) return;

  const list = pendingIce.get(id) || [];

  for(const candidate of list){
    try{
      await pc.addIceCandidate(candidate);
    }catch(e){
      console.warn("Queued ICE error:", e);
    }
  }

  pendingIce.set(id, []);
}

function addVideo(id, stream, name, local){
  let tile = $("video-" + id);

  if(!tile){
    tile = document.createElement("div");
    tile.className = "tile";
    tile.id = "video-" + id;

    const video = document.createElement("video");
    video.autoplay = true;
    video.playsInline = true;
    video.muted = !!local;
    video.srcObject = stream;

    const label = document.createElement("div");
    label.className = "name";
    label.textContent = local ? name + " (You)" : name;

    const state = document.createElement("div");
    state.className = "state";
    state.textContent = local ? "● LOCAL" : "● CONNECTING";

    tile.append(video, label, state);
    $("videos").appendChild(tile);
  }else{
    const video = tile.querySelector("video");
    if(video) video.srcObject = stream;
  }

  const video = tile.querySelector("video");
  if(video) video.play().catch(() => {});
}

function updateVideoState(id,text){
  const tile = $("video-" + id);
  if(tile){
    const state = tile.querySelector(".state");
    if(state) state.textContent = text;
  }
}

function removePeer(id){
  const pc = peers.get(id);
  if(pc){
    try{pc.close()}catch(e){}
  }
  peers.delete(id);
  pendingIce.delete(id);
  $("video-" + id)?.remove();
}

socket.on("participant-joined", async d => {
  if(!meeting || !d?.socketId) return;

  names.set(d.socketId, d.name || "Participant");

  /*
   * Only the host creates the initial offer.
   * This prevents both sides from making competing offers.
   */
  if(meeting.isHost){
    await makePeer(d.socketId, true);
  }
});

socket.on("participant-left", d => {
  if(d?.socketId) removePeer(d.socketId);
});

socket.on("meeting-ended", () => {
  alert("Admin ended the meeting.");
  cleanup(false);
  show("dashboard");
  refresh();
});

$("mic").onclick = () => {
  if(!localStream) return;
  const tracks = localStream.getAudioTracks();
  if(!tracks.length) return;

  const on = !tracks[0].enabled;
  tracks.forEach(t => t.enabled = on);
  $("mic").classList.toggle("off", !on);
  $("mic").textContent = on ? "🎙️" : "🔇";
};

$("camera").onclick = () => {
  if(!localStream) return;
  const tracks = localStream.getVideoTracks();
  if(!tracks.length) return;

  const on = !tracks[0].enabled;
  tracks.forEach(t => t.enabled = on);
  $("camera").classList.toggle("off", !on);
  $("camera").textContent = on ? "📷" : "🚫";
};

$("share").onclick = async () => {
  try{
    if(!navigator.mediaDevices?.getDisplayMedia){
      return alert("Screen sharing is not supported in this browser.");
    }

    const display = await navigator.mediaDevices.getDisplayMedia({
      video:true,
      audio:false
    });

    const screenTrack = display.getVideoTracks()[0];

    for(const pc of peers.values()){
      const sender = pc.getSenders().find(s => s.track?.kind === "video");
      if(sender) await sender.replaceTrack(screenTrack);
    }

    const localVideo = $("video-" + socket.id)?.querySelector("video");
    if(localVideo) localVideo.srcObject = display;

    screenTrack.onended = async () => {
      const cameraTrack = localStream?.getVideoTracks()[0];
      if(!cameraTrack) return;

      for(const pc of peers.values()){
        const sender = pc.getSenders().find(s => s.track?.kind === "video");
        if(sender) await sender.replaceTrack(cameraTrack);
      }

      if(localVideo) localVideo.srcObject = localStream;
    };
  }catch(e){
    console.warn("Screen sharing:", e);
  }
};

$("chatForm").onsubmit = e => {
  e.preventDefault();

  const text = $("chatInput").value.trim();
  if(!text || !meeting) return;

  socket.emit("chat-message",{message:text});
  $("chatInput").value = "";
};

socket.on("chat-message", d => {
  const m = document.createElement("div");
  m.className = "msg";

  const b = document.createElement("b");
  b.textContent = d.sender || "User";

  const div = document.createElement("div");
  div.textContent = d.message || "";

  m.append(b,div);
  $("messages").appendChild(m);
  $("messages").scrollTop = $("messages").scrollHeight;
});

$("mobileChat").onclick = () => $("chat").classList.toggle("open");

$("copyLink").onclick = async () => {
  if(!meeting) return;

  const url = location.origin + "/?meeting=" + encodeURIComponent(meeting.id);

  try{
    await navigator.clipboard.writeText(url);
    alert("Meeting link copied.");
  }catch(e){
    prompt("Copy meeting link:",url);
  }
};

$("leaveMeeting").onclick = () => {
  socket.emit("leave-meeting");
  cleanup(false);
  show("dashboard");
  refresh();
};

$("endMeeting").onclick = () => {
  if(meeting?.isHost && confirm("End meeting for everyone?")){
    socket.emit("end-meeting");
  }
};

$("logout").onclick = () => {
  if(meeting) socket.emit("leave-meeting");
  cleanup(false);
  user = null;
  show("auth");
};

function cleanup(clearMeeting = true){
  if(localStream){
    localStream.getTracks().forEach(t => t.stop());
  }

  localStream = null;

  for(const [id,pc] of peers){
    try{pc.close()}catch(e){}
  }

  peers.clear();
  names.clear();
  pendingIce.clear();

  $("videos").innerHTML = "";
  $("messages").innerHTML = "";

  if(clearMeeting) meeting = null;
}

/* Auto-fill meeting ID from a copied invite link. */
const queryMeeting = new URLSearchParams(location.search).get("meeting");
if(queryMeeting){
  $("meetingIdInput").value = queryMeeting.toUpperCase();
}

/*
 * Optional auto-join after participant login:
 * the ID is preserved, but we still wait for the user to press Join.
 */
</script>
</body>
</html>
